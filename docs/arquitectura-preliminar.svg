<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8762C"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#4B5563}
      .l{font-size:12px;fill:#374151}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">Agente #3 · Pedidos por Telegram · Arquitectura preliminar</text>
  <text x="40" y="68" class="s">El cliente pide en lenguaje natural; el agente pregunta lo que falta, confirma y guarda un pedido estructurado y validado.</text>

  <rect x="210" y="96" width="810" height="530" rx="14" fill="#FFF8F2" stroke="#E8762C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="122" font-size="13" font-weight="700" fill="#C2410C">AWS · us-east-1 · todo como código (Terraform)</text>

  <!-- Cliente -->
  <rect x="30" y="160" width="150" height="84" rx="10" class="box"/><rect x="30" y="160" width="6" height="84" rx="3" fill="#374151"/>
  <text x="48" y="188" class="t">Cliente</text>
  <text x="48" y="208" class="s">"Quiero 2 kg de</text>
  <text x="48" y="224" class="s">tortilla y un refresco"</text>

  <!-- Telegram -->
  <rect x="30" y="330" width="150" height="84" rx="10" class="box"/><rect x="30" y="330" width="6" height="84" rx="3" fill="#229ED9"/>
  <text x="48" y="358" class="t">Telegram</text>
  <text x="48" y="378" class="s">Bot API (gratis)</text>
  <text x="48" y="394" class="s">avisa por webhook</text>

  <!-- Parameter Store -->
  <rect x="245" y="150" width="200" height="90" rx="10" class="box"/><rect x="245" y="150" width="6" height="90" rx="3" fill="#E7157B"/>
  <text x="263" y="178" class="t">Parameter Store</text>
  <text x="263" y="198" class="s">token del bot y secreto</text>
  <text x="263" y="214" class="s">del webhook (cifrados)</text>

  <!-- API Gateway -->
  <rect x="245" y="330" width="200" height="84" rx="10" class="box"/><rect x="245" y="330" width="6" height="84" rx="3" fill="#8C4FFF"/>
  <text x="263" y="358" class="t">API Gateway</text>
  <text x="263" y="378" class="s">POST /telegram</text>
  <text x="263" y="394" class="s">límite de solicitudes</text>

  <!-- Lambda recepcion -->
  <rect x="510" y="150" width="270" height="90" rx="10" class="box"/><rect x="510" y="150" width="6" height="90" rx="3" fill="#ED7100"/>
  <text x="528" y="178" class="t">Lambda · recepción</text>
  <text x="528" y="198" class="s">valida el secreto de Telegram, deja el</text>
  <text x="528" y="214" class="s">mensaje en la fila y responde 200 al</text>
  <text x="528" y="230" class="s">instante (Telegram no espera)</text>

  <!-- Lambda agente -->
  <rect x="510" y="320" width="270" height="104" rx="10" class="box"/><rect x="510" y="320" width="6" height="104" rx="3" fill="#ED7100"/>
  <text x="528" y="346" class="t">Lambda · agente de pedidos</text>
  <text x="528" y="366" class="s">loop: Claude decide → herramienta</text>
  <text x="528" y="382" class="s">(ver catálogo, armar y guardar pedido)</text>
  <text x="528" y="398" class="s">valida el pedido con un esquema;</text>
  <text x="528" y="414" class="s">si falla, corrige o vuelve a preguntar</text>

  <!-- Claude -->
  <rect x="830" y="330" width="170" height="84" rx="10" class="box"/><rect x="830" y="330" width="6" height="84" rx="3" fill="#01A88D"/>
  <text x="846" y="358" class="t">Amazon Bedrock</text>
  <text x="846" y="378" class="s">Claude Haiku</text>
  <text x="846" y="394" class="s">salida estructurada</text>

  <!-- CloudWatch -->
  <rect x="830" y="150" width="170" height="90" rx="10" class="box"/><rect x="830" y="150" width="6" height="90" rx="3" fill="#E7157B"/>
  <text x="846" y="178" class="t">CloudWatch Logs</text>
  <text x="846" y="198" class="s">trazas: tokens, costo,</text>
  <text x="846" y="214" class="s">errores de validación</text>

  <!-- DynamoDB -->
  <rect x="510" y="500" width="270" height="94" rx="10" class="box" stroke="#4053D6" stroke-width="2"/><rect x="510" y="500" width="6" height="94" rx="3" fill="#4053D6"/>
  <text x="528" y="528" class="t">DynamoDB</text>
  <text x="528" y="548" class="s">pedidos + conversaciones</text>
  <text x="528" y="564" class="s">llaves (PK / SK) por decidir</text>
  <text x="528" y="580" class="s" font-style="italic">(ADR 001)</text>

  <!-- EventBridge -->
  <rect x="830" y="500" width="170" height="94" rx="10" class="box" stroke-dasharray="5 4"/><rect x="830" y="500" width="6" height="94" rx="3" fill="#E7157B"/>
  <text x="846" y="528" class="t">EventBridge</text>
  <text x="846" y="548" class="s">evento "PedidoCreado"</text>
  <text x="846" y="564" class="s" font-style="italic">opcional (ADR 003)</text>

  <!-- Sistema tienda -->
  <rect x="1040" y="500" width="140" height="94" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1054" y="528" class="t">Sistema de</text>
  <text x="1054" y="546" class="t">la tienda</text>
  <text x="1054" y="566" class="s">cocina, reparto,</text>
  <text x="1054" y="582" class="s">inventario (futuro)</text>

  <!-- flechas -->
  <line x1="105" y1="244" x2="105" y2="328" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="180" y1="360" x2="243" y2="360" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <path d="M445,360 L478,360 L478,205 L508,205" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="510" y1="180" x2="447" y2="180" stroke="#374151" stroke-width="1.4" marker-end="url(#f)"/>
  <text x="452" y="172" class="l">lee</text>
  <line x1="645" y1="240" x2="645" y2="256" stroke="#E8762C" stroke-width="1.8" marker-end="url(#fn)"/>
  <rect x="510" y="258" width="270" height="44" rx="8" fill="#fff" stroke="#E7157B" stroke-width="1.6"/><rect x="510" y="258" width="6" height="44" rx="3" fill="#E7157B"/>
  <text x="556" y="276" font-size="13" font-weight="700" fill="#111827">Amazon SQS (FIFO) + DLQ</text>
  <text x="556" y="293" class="s">en orden · reintentos · sin duplicados</text>
  <line x1="645" y1="302" x2="645" y2="318" stroke="#E8762C" stroke-width="1.8" marker-end="url(#fn)"/>
  <line x1="780" y1="372" x2="828" y2="372" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="645" y1="424" x2="645" y2="498" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <text x="655" y="466" class="l">lee la conversación, guarda el pedido</text>
  <path d="M540,424 L540,452 L120,452 L120,416" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="230" y="474" class="l">respuesta al cliente (sendMessage)</text>
  <path d="M780,336 L805,336 L805,195 L828,195" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#f)"/>
  <line x1="780" y1="547" x2="828" y2="547" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#f)"/>
  <line x1="1000" y1="547" x2="1038" y2="547" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#f)"/>

  <g>
    <circle cx="105" cy="286" r="11" fill="#111827"/><text x="105" y="290" class="n" text-anchor="middle">1</text>
    <circle cx="212" cy="360" r="11" fill="#111827"/><text x="212" y="364" class="n" text-anchor="middle">2</text>
    <circle cx="478" cy="290" r="11" fill="#111827"/><text x="478" y="294" class="n" text-anchor="middle">3</text>
    <circle cx="535" cy="280" r="11" fill="#E8762C"/><text x="535" y="284" class="n" text-anchor="middle">4</text>
    <circle cx="805" cy="372" r="11" fill="#111827"/><text x="805" y="376" class="n" text-anchor="middle">5</text>
    <circle cx="645" cy="480" r="11" fill="#111827"/><text x="645" y="484" class="n" text-anchor="middle">6</text>
    <circle cx="490" cy="452" r="11" fill="#6B7280"/><text x="490" y="456" class="n" text-anchor="middle">7</text>
    <circle cx="805" cy="547" r="11" fill="#6B7280"/><text x="805" y="551" class="n" text-anchor="middle">8</text>
  </g>

  <text x="40" y="660" font-size="12" font-weight="700" fill="#C2410C">PRELIMINAR · puede cambiar en el camino</text>
  <text x="40" y="680" class="s">Fase 1: todo en mi Mac (Telegram sin webhook + base de datos local).  Fase 2: esta arquitectura en AWS con Terraform + ADRs (base de datos y llaves, fila SQS, eventos).</text>
  <text x="40" y="698" class="s">Fase 3: salida estructurada validada con esquema, corrección automática, errores claros y examen de conversaciones.  Seguridad: roles de IAM con mínimo privilegio, sin llaves.</text>
</svg>
