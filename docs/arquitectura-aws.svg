<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8762C"/></marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#4B5563}
      .l{font-size:12px;fill:#374151}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.2}
      .a{stroke:#374151;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1280" height="880" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">Agente #3 · Pedidos por Telegram · Arquitectura en AWS</text>
  <text x="40" y="68" class="s">El cliente pide en lenguaje natural; el agente pregunta lo que falta, confirma y guarda el pedido. Don Chuy recibe un aviso de cada pedido y consulta pendientes y ventas.</text>

  <rect x="210" y="92" width="850" height="690" rx="14" fill="#FFF8F2" stroke="#E8762C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="118" font-size="13" font-weight="700" fill="#C2410C">AWS · us-east-1 · todo como código (Terraform)</text>

  <!-- Cliente -->
  <rect x="30" y="150" width="150" height="84" rx="10" class="box"/><rect x="30" y="150" width="6" height="84" rx="3" fill="#374151"/>
  <text x="48" y="178" class="t">Cliente</text>
  <text x="48" y="198" class="s">"Quiero 2 kg de</text>
  <text x="48" y="214" class="s">tortilla y un refresco"</text>

  <!-- Telegram -->
  <rect x="30" y="330" width="150" height="84" rx="10" class="box"/><rect x="30" y="330" width="6" height="84" rx="3" fill="#229ED9"/>
  <text x="48" y="358" class="t">Telegram</text>
  <text x="48" y="378" class="s">Bot API (gratis)</text>
  <text x="48" y="394" class="s">avisa por webhook</text>

  <!-- Don Chuy -->
  <rect x="30" y="540" width="150" height="100" rx="10" class="box"/><rect x="30" y="540" width="6" height="100" rx="3" fill="#374151"/>
  <text x="48" y="568" class="t">Don Chuy</text>
  <text x="48" y="588" class="s">el dueño, también por</text>
  <text x="48" y="604" class="s">Telegram: /pendientes,</text>
  <text x="48" y="620" class="s">/ventas, /entregado</text>

  <!-- Parameter Store -->
  <rect x="240" y="140" width="200" height="100" rx="10" class="box"/><rect x="240" y="140" width="6" height="100" rx="3" fill="#E7157B"/>
  <text x="258" y="168" class="t">Parameter Store</text>
  <text x="258" y="188" class="s">token del bot y secreto del</text>
  <text x="258" y="204" class="s">webhook (cifrados) y chat_id</text>
  <text x="258" y="220" class="s">del dueño</text>

  <!-- API Gateway -->
  <rect x="240" y="330" width="200" height="84" rx="10" class="box"/><rect x="240" y="330" width="6" height="84" rx="3" fill="#8C4FFF"/>
  <text x="258" y="358" class="t">API Gateway</text>
  <text x="258" y="378" class="s">HTTP API · POST /telegram</text>
  <text x="258" y="394" class="s">10 por seg (ráfaga 20)</text>

  <!-- Lambda recepcion -->
  <rect x="490" y="140" width="290" height="100" rx="10" class="box"/><rect x="490" y="140" width="6" height="100" rx="3" fill="#ED7100"/>
  <text x="508" y="168" class="t">Lambda · recepción</text>
  <text x="508" y="188" class="s">revisa la clave secreta de Telegram,</text>
  <text x="508" y="204" class="s">mete el mensaje a la fila y responde</text>
  <text x="508" y="220" class="s">200 en milisegundos</text>

  <!-- SQS -->
  <rect x="490" y="268" width="290" height="58" rx="10" fill="#fff" stroke="#E7157B" stroke-width="1.6"/>
  <text x="508" y="292" class="t">SQS FIFO + DLQ</text>
  <text x="508" y="312" class="s">orden por cliente · sin duplicados · 3 intentos</text>
  <text x="760" y="292" class="s" text-anchor="end">ADR 002</text>

  <!-- Lambda agente -->
  <rect x="490" y="354" width="290" height="132" rx="10" class="box"/><rect x="490" y="354" width="6" height="132" rx="3" fill="#ED7100"/>
  <text x="508" y="380" class="t">Lambda · agente de pedidos</text>
  <text x="508" y="400" class="s">Claude decide → herramientas (buscar,</text>
  <text x="508" y="416" class="s">agregar, quitar, confirmar). El código lleva</text>
  <text x="508" y="432" class="s">catálogo, precios, totales y validación.</text>
  <text x="508" y="448" class="s">La guardia frena un "confirmado" falso.</text>
  <text x="508" y="464" class="s">Comandos del dueño: datos exactos, sin IA.</text>

  <!-- Bedrock -->
  <rect x="830" y="370" width="200" height="100" rx="10" class="box"/><rect x="830" y="370" width="6" height="100" rx="3" fill="#01A88D"/>
  <text x="848" y="398" class="t">Amazon Bedrock</text>
  <text x="848" y="418" class="s">Claude Haiku 4.5</text>
  <text x="848" y="434" class="s">perfil Global · Converse</text>
  <text x="848" y="450" class="s">con herramientas</text>

  <!-- CloudWatch -->
  <rect x="830" y="140" width="200" height="100" rx="10" class="box"/><rect x="830" y="140" width="6" height="100" rx="3" fill="#E7157B"/>
  <text x="848" y="168" class="t">CloudWatch</text>
  <text x="848" y="188" class="s">TRAZA: tokens, costo,</text>
  <text x="848" y="204" class="s">herramientas, paradas</text>
  <text x="848" y="220" class="s">2 alarmas en filas de fallas</text>

  <!-- SNS (fuera) -->
  <rect x="1090" y="140" width="165" height="100" rx="10" class="box"/><rect x="1090" y="140" width="6" height="100" rx="3" fill="#E7157B"/>
  <text x="1108" y="168" class="t">SNS → correo</text>
  <text x="1108" y="188" class="s">ALARM cuando algo</text>
  <text x="1108" y="204" class="s">cae en una fila de</text>
  <text x="1108" y="220" class="s">fallas, y OK al volver</text>

  <!-- DynamoDB -->
  <rect x="490" y="540" width="290" height="132" rx="10" class="box" stroke="#4053D6" stroke-width="2"/><rect x="490" y="540" width="6" height="132" rx="3" fill="#4053D6"/>
  <text x="508" y="566" class="t">DynamoDB · tabla única</text>
  <text x="508" y="586" class="s">pláticas (se borran a las 24 h), pedidos,</text>
  <text x="508" y="602" class="s">folio atómico y ventas por semana y mes</text>
  <text x="508" y="618" class="s">índice GSI1: pedidos pendientes</text>
  <text x="508" y="634" class="s">transacción todo o nada · respaldo continuo</text>
  <text x="508" y="656" class="s" font-style="italic">ADR 001 · Stream encendido (ADR 003)</text>

  <!-- Avisadora -->
  <rect x="830" y="540" width="200" height="110" rx="10" class="box"/><rect x="830" y="540" width="6" height="110" rx="3" fill="#ED7100"/>
  <text x="848" y="566" class="t">Lambda · avisadora</text>
  <text x="848" y="586" class="s">filtro: solo pedidos nuevos</text>
  <text x="848" y="602" class="s">palomita "avisado" (sin</text>
  <text x="848" y="618" class="s">avisos dobles) y mensaje</text>
  <text x="848" y="634" class="s">a Don Chuy</text>

  <!-- Avisos fallidos -->
  <rect x="870" y="690" width="160" height="56" rx="10" fill="#fff" stroke="#E7157B" stroke-width="1.6"/>
  <text x="884" y="713" class="t" font-size="14">SQS avisos fallidos</text>
  <text x="884" y="732" class="s">si falla 3 veces</text>

  <!-- ===== flechas ===== -->
  <!-- 1 cliente <-> telegram -->
  <line x1="105" y1="234" x2="105" y2="328" class="a" marker-start="url(#f)" marker-end="url(#f)"/>
  <circle cx="105" cy="282" r="13" fill="#111827"/><text x="105" y="286" class="n" text-anchor="middle">1</text>
  <!-- telegram <-> don chuy -->
  <line x1="70" y1="414" x2="70" y2="538" class="a" marker-start="url(#f)" marker-end="url(#f)"/>
  <!-- 2 telegram -> api -->
  <line x1="180" y1="360" x2="238" y2="360" class="a" marker-end="url(#f)"/>
  <circle cx="209" cy="360" r="13" fill="#111827"/><text x="209" y="364" class="n" text-anchor="middle">2</text>
  <!-- 3 api -> recepcion -->
  <path d="M440,360 L465,360 L465,200 L488,200" class="a" marker-end="url(#f)"/>
  <circle cx="465" cy="290" r="13" fill="#111827"/><text x="465" y="294" class="n" text-anchor="middle">3</text>
  <!-- recepcion -> parameter store -->
  <line x1="490" y1="160" x2="442" y2="160" class="a" marker-end="url(#f)"/>
  <text x="452" y="152" class="l">lee</text>
  <!-- 4 recepcion -> fila -> agente -->
  <line x1="635" y1="240" x2="635" y2="266" stroke="#E8762C" stroke-width="2" marker-end="url(#fn)"/>
  <line x1="635" y1="326" x2="635" y2="352" stroke="#E8762C" stroke-width="2" marker-end="url(#fn)"/>
  <circle cx="665" cy="254" r="13" fill="#E8762C"/><text x="665" y="258" class="n" text-anchor="middle">4</text>
  <!-- 5 agente <-> bedrock -->
  <line x1="780" y1="420" x2="828" y2="420" class="a" marker-start="url(#f)" marker-end="url(#f)"/>
  <circle cx="805" cy="420" r="13" fill="#111827"/><text x="805" y="424" class="n" text-anchor="middle">5</text>
  <!-- agente -> cloudwatch -->
  <path d="M780,370 L812,370 L812,250 L930,250 L930,242" class="a" marker-end="url(#f)"/>
  <!-- 6 agente <-> dynamo -->
  <line x1="635" y1="486" x2="635" y2="538" class="a" marker-start="url(#f)" marker-end="url(#f)"/>
  <circle cx="635" cy="512" r="13" fill="#111827"/><text x="635" y="516" class="n" text-anchor="middle">6</text>
  <!-- 7 respuesta al cliente -->
  <path d="M490,470 L150,470 L150,416" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <circle cx="320" cy="470" r="13" fill="#6B7280"/><text x="320" y="474" class="n" text-anchor="middle">7</text>
  <text x="240" y="492" class="l">respuesta al cliente (sendMessage)</text>
  <!-- 8 stream -> avisadora -->
  <line x1="780" y1="595" x2="828" y2="595" class="a" marker-end="url(#f)"/>
  <circle cx="805" cy="595" r="13" fill="#111827"/><text x="805" y="599" class="n" text-anchor="middle">8</text>
  <!-- 9 aviso a don chuy -->
  <path d="M850,650 L850,764 L105,764 L105,642" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <circle cx="420" cy="764" r="13" fill="#6B7280"/><text x="420" y="768" class="n" text-anchor="middle">9</text>
  <text x="442" y="756" class="l">aviso del pedido nuevo a Don Chuy (por Telegram)</text>
  <!-- avisadora -> fallidos -->
  <line x1="950" y1="650" x2="950" y2="688" stroke="#C0392B" stroke-width="1.6" marker-end="url(#fr)"/>
  <!-- alarmas -> sns -->
  <line x1="1030" y1="190" x2="1088" y2="190" stroke="#C0392B" stroke-width="1.6" marker-end="url(#fr)"/>

  <!-- pie -->
  <text x="40" y="812" font-size="13" font-weight="700" fill="#111827">Seguridad: cada Lambda tiene su propio rol de IAM con mínimo privilegio, sin llaves. El token de Telegram se pega a mano (no está en el código ni en el state).</text>
  <text x="40" y="834" class="s">Examen de conversaciones en AWS: 8/8 · ~US$0.02 por pedido confirmado · 1.9 s por mensaje. El examen usa un modo prueba aislado (folio PR-, ventas aparte, sin aviso).</text>
  <text x="40" y="856" class="s">Flujo: 1-2 el cliente escribe · 3 la recepción revisa la clave · 4 la fila ordena · 5-6 el agente piensa y guarda · 7 contesta · 8-9 el Stream despierta a la avisadora y Don Chuy se entera.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
